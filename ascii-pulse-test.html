<script>
(async()=>{
 try{
  if(!window.__AP_CHUNKS||window.__AP_CHUNKS.length!==5)throw new Error('App bundle did not load. Reload the page.');
  const b=window.__AP_CHUNKS.join(''),bin=atob(b),u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  if(!('DecompressionStream' in window))throw new Error('Please update Safari/iOS before running ASCII PULSE PRO.');
  const ds=new DecompressionStream('gzip');
  const ab=await new Response(new Blob([u]).stream().pipeThrough(ds)).arrayBuffer();
  const html=new TextDecoder().decode(ab);
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('load').innerHTML='<b>ASCII PULSE PRO</b><br><small>'+e.message+'</small>'}
})();
</script>
