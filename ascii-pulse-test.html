<style>
html,body{margin:0;height:100%;background:#05070a;color:#eefbff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:grid;place-items:center}#load{text-align:center;padding:24px;line-height:1.6}b{color:#bff5ff;letter-spacing:.08em}small{color:#82929f}.bar{width:220px;max-width:70vw;height:5px;background:#13202a;border-radius:99px;margin:16px auto;overflow:hidden}.bar i{display:block;height:100%;width:30%;background:#59d8ff;animation:a 1s infinite alternate ease-in-out}@keyframes a{to{width:100%}}button{margin-top:16px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid #59d8ff;background:#102630;color:#bff5ff;font:inherit;font-weight:800}
</style>
</head>
<body>
<div id="load"><b>ASCII PULSE PRO</b><br><small>Loading professional music-video engine…</small><div class="bar"><i></i></div></div>
<script>window.__AP_CHUNKS=[];</script>
<script src="ap-pro-0.js?v=pro-20260823c"></script>
<script src="ap-pro-1.js?v=pro-20260823c"></script>
<script src="ap-pro-2.js?v=pro-20260823c"></script>
<script src="ap-pro-3.js?v=pro-20260823c"></script>
<script src="ap-pro-4.js?v=pro-20260823c"></script>
<script>
(async()=>{
 const box=document.getElementById('load');
 const fail=(msg)=>{box.innerHTML='<b>ASCII PULSE PRO</b><br><small>'+msg+'</small><br><button onclick="location.reload()">RELOAD</button>'};
 try{
  if(!Array.isArray(window.__AP_CHUNKS)) throw new Error('Bundle array missing.');
  for(let i=0;i<5;i++){
    if(typeof window.__AP_CHUNKS[i]!=='string'||window.__AP_CHUNKS[i].length<100){
      throw new Error('Bundle part '+(i+1)+' did not load. Reload the page.');
    }
  }
  let b64=window.__AP_CHUNKS.slice(0,5).join('');
  b64=b64.replace(/\s+/g,'').replace(/[^A-Za-z0-9+/=]/g,'');
  const rem=b64.length%4;
  if(rem) b64+='='.repeat(4-rem);
  let bin;
  try{bin=atob(b64)}catch(e){throw new Error('Bundle decode failed. Please reload Safari.');}
  const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  if(!('DecompressionStream' in window)) throw new Error('Please update iOS/Safari. This version needs a newer Safari engine.');
  const ds=new DecompressionStream('gzip');
  let ab;
  try{ab=await new Response(new Blob([u]).stream().pipeThrough(ds)).arrayBuffer()}catch(e){throw new Error('Bundle decompression failed. Reload the page once.');}
  const html=new TextDecoder().decode(ab);
  if(!html||html.length<10000||!html.includes('ASCII PULSE')) throw new Error('App bundle is incomplete. Reload the page.');
  document.open();document.write(html);document.close();
 }catch(e){console.error(e);fail(e.message||'Unknown loading error.');}
})();
</script>
</body>
</html>
