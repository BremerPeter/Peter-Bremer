<style>
html,body{margin:0;height:100%;background:#05070a;color:#eefbff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:grid;place-items:center}#load{text-align:center;padding:24px;line-height:1.6}b{color:#bff5ff;letter-spacing:.08em}small{color:#82929f}.bar{width:220px;max-width:70vw;height:5px;background:#13202a;border-radius:99px;margin:16px auto;overflow:hidden}.bar i{display:block;height:100%;width:30%;background:#59d8ff;animation:a 1s infinite alternate ease-in-out}@keyframes a{to{width:100%}}button{margin-top:16px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid #59d8ff;background:#102630;color:#bff5ff;font:inherit;font-weight:800}

</head>
<body>
<div id="load"><b>ASCII PULSE PRO</b><br><small id="msg">Loading professional music-video engine…</small><div class="bar"><i></i></div></div>
<script>window.__AP_CHUNKS=[];</script>
<script src="ap-pro-0.js?v=pro-20260823e"></script>
<script src="ap-pro-1.js?v=pro-20260823e"></script>
<script src="ap-pro-2.js?v=pro-20260823e"></script>
<script src="ap-pro-3.js?v=pro-20260823e"></script>
<script src="ap-pro-4.js?v=pro-20260823e"></script>
<script>
(async()=>{
 const msg=document.getElementById('msg');
 try{
   const parts=window.__AP_CHUNKS;
   if(!Array.isArray(parts)||parts.length!==5||parts.some(x=>typeof x!=='string'||x.length<10)) throw new Error('App bundle did not load completely. Reload the page.');
   msg.textContent='Decoding app…';
   const decoded=[]; let total=0;
   for(let p=0;p<parts.length;p++){
     const clean=parts[p].replace(/\s+/g,'');
     let bin;
     try{ bin=atob(clean); }catch(err){ throw new Error('Bundle part '+(p+1)+' could not be decoded.'); }
     const u=new Uint8Array(bin.length);
     for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
     decoded.push(u); total+=u.length;
   }
   const packed=new Uint8Array(total); let off=0;
   for(const u of decoded){packed.set(u,off);off+=u.length;}
   if(!('DecompressionStream' in window)) throw new Error('This Safari version is too old. Update iOS/Safari and try again.');
   msg.textContent='Starting music-video engine…';
   const ds=new DecompressionStream('gzip');
   const ab=await new Response(new Blob([packed]).stream().pipeThrough(ds)).arrayBuffer();
   const html=new TextDecoder('utf-8').decode(ab);
   if(!html.includes('<title>ASCII PULSE PRO</title>')&&!html.includes('ASCII PULSE')) throw new Error('Decoded app bundle is invalid.');
   document.open();document.write(html);document.close();
 }catch(e){
   console.error(e);
   document.getElementById('load').innerHTML='<b>ASCII PULSE PRO</b><br><small>'+String(e.message||e)+'</small><br><button onclick="location.reload()">RELOAD</button>';
 }
})();
</script>
